openapi: '3.1.0'
info:
  title: 'CareGuard API'
  version: '1.0.0'
  description: 'OpenAPI spec for CareGuard services: agent spending, pharmacy, bill audit, drug interactions, and payments.'
servers:
  - url: 'http://localhost:3000'
    description: 'Development server'
  - url: 'https://api.careguard.xyz'
    description: 'Production server'
security:
  - X402Auth:
[]
components:
  securitySchemes:
    X402Auth:
      type: 'http'
      scheme: 'bearer'
      description: 'x402 payment protocol. Include X-PAYMENT header with payment proof on protected routes.'
  schemas:
    Error:
      type: 'object'
      required:
        - error
        - code
      properties:
        error:
          type: 'string'
          description: 'A human-readable description of the error.'
        code:
          type: 'string'
          description: 'A stable, machine-readable uppercase SNAKE_CASE code identifying the specific type of error.'
        details:
          type: 'object'
          description: 'Structured metadata or field-level details specific to the error code.'
    ReadinessResponse:
      type: 'object'
      description: 'See docs/observability/health-checks.md for the full schema and check semantics.'
      properties:
        status:
          type: 'string'
          enum:
            - 'ok'
            - 'degraded'
        checks:
          type: 'object'
          properties:
            env:
              oneOf:
                - type: 'boolean'
                - type: 'string'
            horizon:
              type: 'boolean'
            ozFacilitator:
              oneOf:
                - type: 'boolean'
                - type: 'string'
  responses:
    BadRequestError:
      description: 'Bad Request / Validation Error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: 'Missing or invalid authentication credentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: 'Forbidden access (e.g., CSRF token mismatch, invalid admin credentials)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: 'Requested resource not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequiredError:
      description: 'Payment required (x402 / MPP Challenge)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: 'Conflict / State violation (e.g., Agent is paused)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 'Internal server error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /health:
    get:
      summary: 'Liveness probe — always fast, no dependency checks'
      tags:
        - 'Observability'
      security:
[]
      responses:
        200:
          description: 'Process is up'
          content:
            application/json:
              schema:
                type: 'object'
                properties:
                  status:
                    type: 'string'
                    enum:
                      - 'ok'
  /ready:
    get:
      summary: 'Readiness probe — checks required env, Horizon, and OZ facilitator status'
      tags:
        - 'Observability'
      security:
[]
      responses:
        200:
          description: 'All dependency checks passed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        503:
          description: 'Draining, or at least one dependency check failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /agent/spending:
    get:
      summary: 'Get agent spending summary'
      tags:
        - 'Agent'
      responses:
        200:
          description: 'Spending summary'
          content:
            application/json:
              schema:
                type: 'object'
                properties:
                  totalSpent:
                    type: 'number'
                  categories:
                    type: 'object'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        500:
          $ref: '#/components/responses/InternalServerError'
  /pharmacy/compare:
    get:
      summary: 'Compare pharmacy prices for a drug'
      tags:
        - 'Pharmacy'
      security:
        - X402Auth:
[]
      parameters:
        - in: 'query'
          name: 'drug'
          required: true
          schema:
            type: 'string'
            minLength: 1
            maxLength: 80
          description: 'Drug name. Maximum length: 80 characters.'
        - in: 'query'
          name: 'dosage'
          required: false
          schema:
            type: 'string'
            minLength: 1
            maxLength: 80
          description: 'Optional dosage string. Maximum length: 80 characters.'
        - in: 'query'
          name: 'zip'
          required: false
          schema:
            type: 'string'
            pattern: '^\d{5}$'
          description: '5-digit ZIP code used for distance adjustments.'
      responses:
        200:
          description: 'Pharmacy query results'
        400:
          $ref: '#/components/responses/BadRequestError'
        402:
          $ref: '#/components/responses/PaymentRequiredError'
  /pharmacy/prices:
    post:
      summary: 'Admin upsert for a drug price at a pharmacy'
      tags:
        - 'Pharmacy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: 'object'
              properties:
                drug:
                  type: 'string'
                  minLength: 1
                  maxLength: 80
                pharmacyId:
                  type: 'string'
                  minLength: 1
                  maxLength: 80
                price:
                  type: 'number'
                  exclusiveMinimum: 0
                  maximum: 10000
              required:
                - 'drug'
                - 'pharmacyId'
                - 'price'
      responses:
        200:
          description: 'Price created or updated'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
  /bill/audit:
    post:
      summary: 'Audit medical bills'
      tags:
        - 'Bill Audit'
      security:
        - X402Auth:
[]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: 'object'
              properties:
                lineItems:
                  type: 'array'
                  items:
                    type: 'object'
                    properties:
                      cptCode:
                        type: 'string'
                      quantity:
                        type: 'integer'
                        minimum: 1
                        maximum: 999
                      chargedAmount:
                        type: 'number'
                        minimum: 0
                        maximum: 1000000
                      description:
                        type: 'string'
                        minLength: 1
                        maxLength: 80
                    required:
                      - 'cptCode'
                      - 'quantity'
                      - 'chargedAmount'
                      - 'description'
              required:
                - 'lineItems'
      responses:
        200:
          description: 'Audit results'
        400:
          $ref: '#/components/responses/BadRequestError'
        402:
          $ref: '#/components/responses/PaymentRequiredError'
  /drug/interactions:
    get:
      summary: 'Check drug interactions for a medication list'
      tags:
        - 'Drug Interactions'
      security:
        - X402Auth:
[]
      parameters:
        - in: 'query'
          name: 'meds'
          required: true
          schema:
            type: 'string'
            minLength: 1
            maxLength: 1619
          description: 'Comma-separated medication names. Each medication name is limited to 80 characters.'
      responses:
        200:
          description: 'Drug interaction results'
        400:
          $ref: '#/components/responses/BadRequestError'
        402:
          $ref: '#/components/responses/PaymentRequiredError'
  /pharmacy/order:
    post:
      summary: 'Submit a paid pharmacy order'
      tags:
        - 'Pharmacy Payments'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: 'object'
              properties:
                drug:
                  type: 'string'
                  minLength: 1
                  maxLength: 80
                pharmacy:
                  type: 'string'
                  minLength: 1
                  maxLength: 80
                amount:
                  oneOf:
                    - type: 'number'
                      minimum: 0.01
                      maximum: 10000
                    - type: 'string'
              required:
                - 'drug'
                - 'pharmacy'
                - 'amount'
      responses:
        200:
          description: 'Order confirmed'
        400:
          $ref: '#/components/responses/BadRequestError'
        402:
          $ref: '#/components/responses/PaymentRequiredError'
  /docs:
    get:
      summary: 'API documentation UI'
      tags:
        - 'Documentation'
      responses:
        200:
          description: 'Scalar UI serving this OpenAPI spec'